[project]
name = "on-call-scheduler"
version = "0.1.0"
description = "PagerDuty on-call schedule manager for identifying and managing on-call coverage"
authors = [
    {name = "Sentry", email = "support@sentry.io"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

dependencies = [
    "pagerduty>=6.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
oncall-scheduler = "oncall_scheduler.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall_scheduler"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/oncall_scheduler --cov-report=term-missing"
